<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coche Compartido - Amigos</title>
  
  <!-- Carga de React, Tailwind y Firebase -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    // =========================================================
    // TU CONFIGURACIÓN DE FIREBASE CORREGIDA
    // =========================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBDmqr4lkAU5uAtbh_0BMdTvPma0gc59cA",
      authDomain: "coches-amigos.firebaseapp.com",
      projectId: "coches-amigos",
      storageBucket: "coches-amigos.firebasestorage.app",
      messagingSenderId: "265052406529",
      appId: "1:265052406529:web:8f0a3580b68d16a3c79100",
      measurementId: "G-90M6BQP2NH"
    };
    // =========================================================

    // Inicializamos Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const docRef = db.collection("coche_compartido").doc("semana");

    function App() {
      // Estado principal de la app (solo usuarios y conductores por día)
      const [data, setData] = React.useState({ users: {}, dailyDrivers: {} });
      const [myName, setMyName] = React.useState("");
      const [isLogged, setIsLogged] = React.useState(false);
      const [showPDF, setShowPDF] = React.useState(false);
      
      const pdfUrl = "https://escuelapolitecnica.uah.es/export/sites/politecnica/es/.galleries/estudiantes/Semestre1_GIC.pdf";
      const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
      const shifts = ["8-10", "10-12", "12-14", "15-17", "17-19", "19-21"];

      // Cargar datos en tiempo real de Firebase
      React.useEffect(() => {
        const unsubscribe = docRef.onSnapshot((docSnap) => {
          if (docSnap.exists) {
            setData(docSnap.data());
          } else {
            docRef.set({ users: {}, dailyDrivers: {} });
          }
        });
        return () => unsubscribe();
      }, []);

      const login = (e) => {
        e.preventDefault();
        if (myName.trim()) setIsLogged(true);
      };

      const deleteAccount = () => {
        if (window.confirm("¿Estás seguro de que quieres borrar todos tus turnos y viajes? Tu nombre desaparecerá de la tabla.")) {
          let newUsers = { ...data.users };
          delete newUsers[myName];

          let newDailyDrivers = { ...(data.dailyDrivers || {}) };
          Object.keys(newDailyDrivers).forEach(day => {
            if (newDailyDrivers[day] === myName) newDailyDrivers[day] = ""; 
          });

          docRef.update({ users: newUsers, dailyDrivers: newDailyDrivers }).then(() => {
            setMyName("");
            setIsLogged(false);
          });
        }
      };

      const toggleShift = (day, shift) => {
        const shiftId = `${day}_${shift}`;
        let newUsers = { ...data.users };
        if (!newUsers[myName]) newUsers[myName] = [];

        if (newUsers[myName].includes(shiftId)) {
          newUsers[myName] = newUsers[myName].filter(id => id !== shiftId);
        } else {
          newUsers[myName].push(shiftId);
        }
        docRef.update({ users: newUsers });
      };

      const setDailyDriver = (day, driverName) => {
        let newDailyDrivers = { ...(data.dailyDrivers || {}), [day]: driverName };
        docRef.update({ dailyDrivers: newDailyDrivers });
      };

      const getPeopleInShift = (day, shift) => {
        const shiftId = `${day}_${shift}`;
        return Object.entries(data.users || {})
          .filter(([name, shifts]) => shifts.includes(shiftId))
          .map(([name]) => name);
      };

      // Calcular Ranking (Solo cuenta los días que pones coche)
      const driverCounts = {};
      Object.keys(data.users || {}).forEach(user => driverCounts[user] = 0);
      
      Object.values(data.dailyDrivers || {}).forEach(driver => {
        if (driver) driverCounts[driver] = (driverCounts[driver] || 0) + 1;
      });

      if (!isLogged) {
        return (
          <div className="flex items-center justify-center min-h-screen">
            <div className="bg-slate-800 p-8 rounded-2xl shadow-xl max-w-sm w-full border border-emerald-500/20">
              <h1 className="text-2xl font-bold mb-6 text-center text-emerald-400">🚗 Coche Compartido</h1>
              <form onSubmit={login}>
                <input
                  type="text"
                  placeholder="Escribe tu nombre..."
                  value={myName}
                  onChange={(e) => setMyName(e.target.value)}
                  className="w-full p-3 bg-slate-700 rounded-lg text-white mb-4 border border-slate-600 focus:border-emerald-500 focus:outline-none"
                  required
                />
                <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-3 rounded-lg transition-colors">
                  Entrar
                </button>
              </form>
            </div>
          </div>
        );
      }

      const allUsers = Object.keys(data.users || {});

      return (
        <div className="max-w-6xl mx-auto p-4 md:p-8">
          
          {/* Cabecera Principal */}
          <div className="flex flex-wrap justify-between items-center mb-6 gap-4">
            <h1 className="text-3xl font-bold text-emerald-400">🚗 Turnos del Coche</h1>
            <div className="flex items-center gap-3 flex-wrap">
              <div className="bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
                Hola, <span className="text-emerald-400 font-bold">{myName}</span>
              </div>
              
              <button 
                onClick={() => setShowPDF(!showPDF)}
                className="bg-blue-500/10 text-blue-400 border border-blue-500/50 hover:bg-blue-500 hover:text-white px-3 py-2 rounded-lg transition-colors text-sm font-semibold flex items-center gap-2"
              >
                📄 {showPDF ? "Ocultar Horario UAH" : "Ver Horario UAH"}
              </button>

              <button 
                onClick={deleteAccount}
                className="bg-red-500/10 text-red-400 border border-red-500/50 hover:bg-red-500 hover:text-white px-3 py-2 rounded-lg transition-colors text-sm font-semibold"
              >
                Borrar cuenta
              </button>
            </div>
          </div>

          {/* Visor PDF (Oculto por defecto) */}
          {showPDF && (
            <div className="bg-slate-800 rounded-2xl p-4 mb-8 border border-blue-500/30 shadow-lg h-[600px] flex flex-col">
              <div className="flex justify-between items-center mb-3 px-2">
                <h2 className="text-lg font-semibold text-slate-200">📅 Horario GIC (Semestre 1)</h2>
                <a href={pdfUrl} target="_blank" rel="noreferrer" className="text-blue-400 hover:text-blue-300 hover:underline text-sm font-medium">
                  Abrir en pestaña nueva ↗
                </a>
              </div>
              <iframe 
                src={pdfUrl} 
                className="w-full flex-1 rounded-xl bg-slate-300" 
                title="Horario UAH"
              ></iframe>
            </div>
          )}

          {/* Ranking de conductores (Días) */}
          <div className="bg-slate-800 rounded-2xl p-6 mb-8 border border-emerald-500/20 shadow-lg">
            <h2 className="text-xl font-semibold mb-4 text-slate-200">🏆 Ranking (Días de coche)</h2>
            <div className="flex flex-wrap gap-4">
              {Object.entries(driverCounts)
                .sort((a, b) => b[1] - a[1])
                .map(([name, count]) => (
                <div key={name} className="bg-slate-700 px-4 py-3 rounded-xl flex flex-col items-center min-w-[100px] border border-slate-600">
                  <span className="font-medium">{name}</span>
                  <span className="text-2xl font-bold text-emerald-400 mt-1">{count}</span>
                </div>
              ))}
              {Object.keys(driverCounts).length === 0 && (
                <span className="text-slate-400 text-sm">Aún no hay conductores asignados.</span>
              )}
            </div>
          </div>

          {/* Tabla principal */}
          <div className="overflow-x-auto bg-slate-800 rounded-2xl border border-slate-700 shadow-xl pb-4">
            <table className="w-full text-center border-collapse min-w-[800px]">
              <thead>
                <tr className="bg-slate-900/50">
                  <th className="p-4 border-b border-r border-slate-700 w-24 align-top">
                    <div className="font-bold text-slate-300 mt-2">Hora</div>
                  </th>
                  {days.map(day => {
                    const currentDailyDriver = (data.dailyDrivers || {})[day] || "";
                    return (
                      <th key={day} className="p-4 border-b border-slate-700 align-top">
                        <div className="text-emerald-400 font-bold text-lg mb-3">{day}</div>
                        
                        <div className="bg-slate-800/80 p-2 rounded-lg border border-slate-600">
                          <div className="text-xs font-normal text-slate-400 mb-1">Coche de hoy:</div>
                          <select 
                            value={currentDailyDriver}
                            onChange={(e) => setDailyDriver(day, e.target.value)}
                            className={`w-full text-sm p-1.5 rounded bg-slate-900 border ${currentDailyDriver ? 'border-emerald-500 text-emerald-400 font-semibold' : 'border-slate-600 text-slate-300'} focus:outline-none`}
                          >
                            <option value="">Nadie asignado</option>
                            {allUsers.map(u => (
                              <option key={u} value={u}>{u}</option>
                            ))}
                          </select>
                        </div>
                      </th>
                    );
                  })}
                </tr>
              </thead>
              <tbody>
                {shifts.map(shift => (
                  <tr key={shift} className="hover:bg-slate-700/20 transition-colors">
                    <td className="p-4 border-b border-r border-slate-700 font-medium text-slate-300">{shift}</td>
                    {days.map(day => {
                      const shiftId = `${day}_${shift}`;
                      const people = getPeopleInShift(day, shift);
                      const amIGoing = people.includes(myName);
                      const isMatch = people.length > 1;

                      return (
                        <td key={day} className="p-3 border-b border-slate-700 align-top">
                          <button
                            onClick={() => toggleShift(day, shift)}
                            className={`w-full p-2 rounded-lg text-sm font-medium transition-all duration-300 ${
                              amIGoing 
                                ? "bg-emerald-500/20 border-emerald-500 text-emerald-400 border shadow-[0_0_10px_rgba(16,185,129,0.2)]" 
                                : "bg-slate-700 border-transparent text-slate-400 hover:bg-slate-600 border"
                            }`}
                          >
                            {amIGoing ? "✓ Apuntado" : "+ Me apunto"}
                          </button>
                          
                          <div className="mt-2 min-h-[24px] flex flex-wrap justify-center gap-1">
                            {people.map(p => (
                              <span key={p} className={`text-xs px-2 py-1 rounded-full ${isMatch ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30' : 'bg-slate-600 text-slate-300'}`}>
                                {p}
                              </span>
                            ))}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
